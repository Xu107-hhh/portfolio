<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <defs>
    <linearGradient id="ma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="320" rx="20" fill="#12141b"/>
  <!-- core glow -->
  <circle cx="240" cy="160" r="90" fill="url(#core)" opacity="0.4"/>
  <!-- connections -->
  <g stroke="#7c6cff" stroke-opacity="0.4" stroke-width="1.5">
    <line x1="240" y1="160" x2="120" y2="90"/>
    <line x1="240" y1="160" x2="360" y2="90"/>
    <line x1="240" y1="160" x2="100" y2="220"/>
    <line x1="240" y1="160" x2="380" y2="220"/>
    <line x1="240" y1="160" x2="240" y2="70"/>
    <line x1="240" y1="160" x2="240" y2="260"/>
    <line x1="120" y1="90" x2="240" y2="70"/>
    <line x1="360" y1="90" x2="240" y2="70"/>
  </g>
  <!-- central coordinator -->
  <circle cx="240" cy="160" r="26" fill="url(#ma)"/>
  <circle cx="240" cy="160" r="26" fill="none" stroke="#c8b6ff" stroke-opacity="0.6"/>
  <!-- agents -->
  <circle cx="240" cy="70" r="14" fill="#1a1d26" stroke="#7c6cff" stroke-width="2"/>
  <circle cx="120" cy="90" r="14" fill="#1a1d26" stroke="#5b8cff" stroke-width="2"/>
  <circle cx="360" cy="90" r="14" fill="#1a1d26" stroke="#5b8cff" stroke-width="2"/>
  <circle cx="100" cy="220" r="12" fill="#1a1d26" stroke="#34d3b8" stroke-width="2"/>
  <circle cx="380" cy="220" r="12" fill="#1a1d26" stroke="#34d3b8" stroke-width="2"/>
  <circle cx="240" cy="260" r="12" fill="#1a1d26" stroke="#c8b6ff" stroke-width="2"/>
  <!-- pulse dots -->
  <circle cx="240" cy="70" r="3" fill="#7c6cff"/>
  <circle cx="120" cy="90" r="3" fill="#5b8cff"/>
  <circle cx="360" cy="90" r="3" fill="#5b8cff"/>
  <text x="240" y="305" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" fill="#a1a5b0" letter-spacing="2">MULTI-AGENT · 8 SOURCES</text>
</svg>
